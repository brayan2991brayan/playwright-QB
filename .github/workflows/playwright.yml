name: 🎭 QBench Playwright Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    
    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4

    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: 📦 Install dependencies
      run: npm ci

    - name: 🎭 Install Playwright Browsers
      run: npx playwright install --with-deps ${{ matrix.browser }}

    - name: 🧪 Run Playwright tests
      run: npx playwright test --project=${{ matrix.browser }} --reporter=github
      env:
        QBENCH_BASE_URL: ${{ secrets.QBENCH_BASE_URL || 'https://srqaengineer-ba-uat.qbench.net' }}
        QBENCH_USERNAME: ${{ secrets.QBENCH_USERNAME || 'melvin+qaengineer@qbench.com' }}
        QBENCH_PASSWORD: ${{ secrets.QBENCH_PASSWORD }}

    - name: 📊 Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report-${{ matrix.browser }}
        path: playwright-report/
        retention-days: 30

    - name: 📸 Upload screenshots
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: playwright-screenshots-${{ matrix.browser }}
        path: test-results/
        retention-days: 7

  # Job to run all browsers together (optional)
  test-all:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    
    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4

    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: 📦 Install dependencies
      run: npm ci

    - name: 🎭 Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: 🎯 Run all tests (Complete Suite)
      run: npx playwright test --reporter=html
      env:
        QBENCH_BASE_URL: ${{ secrets.QBENCH_BASE_URL || 'https://srqaengineer-ba-uat.qbench.net' }}
        QBENCH_USERNAME: ${{ secrets.QBENCH_USERNAME || 'melvin+qaengineer@qbench.com' }}
        QBENCH_PASSWORD: ${{ secrets.QBENCH_PASSWORD }}

    - name: 📊 Upload HTML Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report-complete
        path: playwright-report/
        retention-days: 30

    - name: 📈 Comment PR with results
      uses: actions/github-script@v7
      if: github.event_name == 'pull_request'
      with:
        script: |
          const fs = require('fs');
          try {
            const reportPath = 'playwright-report/index.html';
            if (fs.existsSync(reportPath)) {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: '🎭 **Playwright Test Results**\n\nTest report has been generated and uploaded as an artifact. Check the Actions tab for detailed results.'
              });
            }
          } catch (error) {
            console.log('Could not create PR comment:', error);
          }
